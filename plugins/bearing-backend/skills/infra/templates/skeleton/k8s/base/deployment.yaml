apiVersion: apps/v1
kind: Deployment
metadata:
  name: __REPO_SLUG__
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {}
  template:
    metadata:
      labels: {}
    spec:
      # The Kubernetes service account is annotated by the overlay with the
      # Google service account email from envs/<env> outputs (workload identity).
      serviceAccountName: __REPO_SLUG__
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Never latest. Overlays set the tag (dev, qa) or the digest (prod).
          image: registry.example.com/__REPO_SLUG__:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          # Secrets arrive through the secret manager sync (External Secrets
          # or the CSI driver) as this Secret; nothing in this repo holds a value.
          envFrom:
            - secretRef:
                name: __REPO_SLUG__-env
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
