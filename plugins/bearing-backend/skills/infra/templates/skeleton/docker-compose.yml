# Local dependencies for engineers testing application code against the
# shapes this repository provisions. Never runs Terraform, never holds a
# real credential; the passwords are throwaway defaults.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: __REPO_SLUG__
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
