# __REPO_NAME__ pipeline (data pipeline). Stages follow the kit vocabulary.
# make check is the gate; CI runs the same targets the engineer runs, one
# job per gate so a failure names itself. GitLab sets CI=true, so a gate
# whose tool is missing fails here instead of printing SKIPPED.

stages: [validate, lint, test, security, build, publish, deploy]

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.30"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never
  POSTGRES_DB: warehouse_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DBT_TARGET: dev
  DBT_HOST: postgres
  DBT_USER: postgres
  DBT_PASSWORD: postgres
  DBT_DBNAME: warehouse_test
  DBT_SCHEMA: analytics
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  image: python:${PYTHON_VERSION}-slim-bookworm
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache, .venv]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make git >/dev/null
    - pip install --quiet --disable-pip-version-check "uv==${UV_VERSION}"
    - uv --version
    - if [ -f uv.lock ]; then uv sync --locked --all-groups; else echo "lockfile:none committed, resolving now (run uv lock and commit uv.lock)"; uv sync --all-groups; fi
    - cp profiles.yml.example profiles.yml

branch-name:
  stage: validate
  image: alpine:3.20
  before_script: []
  cache: []
  rules: [{ if: $CI_PIPELINE_SOURCE == "merge_request_event" }]
  script:
    - echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -Eq '^(feature|bugfix|hotfix|chore|docs)/[A-Z][A-Z0-9]*(-[0-9]+)+-[A-Za-z0-9]+$|^release/v[0-9]+\.[0-9]+\.[0-9]+$'
    - echo "branch-name: 1 branch checked"

# POSIX sh: alpine/git runs busybox ash, which has no process substitution.
commits:
  stage: validate
  image: alpine/git:2.45.2
  before_script: []
  cache: []
  rules: [{ if: $CI_PIPELINE_SOURCE == "merge_request_event" }]
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=200
    - |
      range="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"
      subjects=$(mktemp)
      git log --no-merges --format=%s "$range" > "$subjects"
      n=$(wc -l < "$subjects" | tr -d ' ')
      [ "$n" -gt 0 ] || { echo "commits: 0 commits in range $range"; exit 1; }
      bad=0
      while IFS= read -r subj; do
        echo "$subj" | grep -Eq '^(feat|fix|refactor|test|docs|chore|perf|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}( \[[A-Z][A-Z0-9]*(-[0-9]+)+\])?$' || { echo "bad subject: $subj"; bad=$((bad+1)); }
      done < "$subjects"
      if git log --no-merges --format=%B "$range" | grep -Eiq 'co-authored-by: .*(claude|anthropic|copilot|chatgpt|gemini)|generated with'; then echo "AI attribution trailer found"; exit 1; fi
      echo "commits: $n commits checked, $bad bad"
      [ "$bad" -eq 0 ]

format:
  stage: lint
  script: [make format-check]

lint:
  stage: lint
  script: [make lint]

dbt-parse:
  stage: lint
  script: [make dbt-parse]

dag-test:
  stage: test
  script: [make dag-test]

unit:
  stage: test
  script: [make test]
  artifacts:
    when: always
    reports:
      junit: junit.xml

# Needs a warehouse, so it is a job here and not part of make check.
dbt-test:
  stage: test
  services: [{ name: postgres:16, alias: postgres }]
  script:
    - make dbt-seed
    - make dbt-run
    - make dbt-test
    - make lint-dbt
    - make dbt-docs
  artifacts:
    paths: [dbt/target/manifest.json, dbt/target/catalog.json]
    expire_in: 1 week

dependency-scan:
  stage: security
  script: [make vuln]
  allow_failure: false

build:
  stage: build
  image: { name: gcr.io/kaniko-project/executor:v1.23.2-debug, entrypoint: [""] }
  before_script: []
  cache: []
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE" --no-push --tar-path image.tar
  artifacts: { paths: [image.tar], expire_in: 1 day }

publish:
  stage: publish
  image: { name: gcr.io/go-containerregistry/crane:debug, entrypoint: [""] }
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane push image.tar "$IMAGE"
    - '[ -z "$CI_COMMIT_TAG" ] || crane tag "$IMAGE" "$CI_COMMIT_TAG"'

# Deploys are manual: the DAG files go to the orchestrator's DAG bucket or
# repository and the runner image is pinned in the DAG's environment.
deploy-qa:
  stage: deploy
  image: alpine:3.20
  before_script: []
  cache: []
  environment: { name: qa }
  rules: [{ if: $CI_COMMIT_BRANCH == "develop", when: manual }]
  script:
    - echo "deploy dags/ and $IMAGE to the qa orchestrator: wire this job to your DAG sync and image pin"
    - exit 1

deploy-production:
  stage: deploy
  image: alpine:3.20
  before_script: []
  cache: []
  environment: { name: production }
  rules: [{ if: $CI_COMMIT_TAG, when: manual }]
  script:
    - echo "deploy dags/ and $IMAGE to the production orchestrator: wire this job to your DAG sync and image pin"
    - exit 1
