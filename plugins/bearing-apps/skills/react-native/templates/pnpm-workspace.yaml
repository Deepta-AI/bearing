# Expo, Metro and jest-expo expect a flat node_modules; pnpm's default isolated layout breaks them.
nodeLinker: hoisted

# Supply chain (pnpm 10.16 or later): a version published less than three days
# ago is not installed, the same wait Renovate keeps, so a hijacked release has
# time to be pulled first. pnpm 10 runs no dependency install scripts unless the
# package is listed under onlyBuiltDependencies. For an urgent fix in a newer
# release, list that one package under minimumReleaseAgeExclude with the reason
# in the commit; never drop the setting.
minimumReleaseAge: 4320
