# __REPO_NAME__ CI on GitHub Actions: the twin of .gitlab-ci.yml. Same stages
# (validate, lint, test, security, build, then deploy on request) and every
# gate is `make <target>`, so the Makefile stays the single source of what a
# gate does. GitHub sets CI=true, so a gate whose tool is missing fails here
# instead of printing SKIPPED.
#
# The two-approval rule (one peer, one lead, from CODEOWNERS) is a branch
# protection setting, not something a workflow can enforce: Settings >
# Branches > main and develop: require a pull request, 2 approving reviews,
# review from Code Owners, dismiss stale approvals, and the status checks
# lint, unit, e2e, dependency-scan and build.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the image of this ref (a person approves in the environment)"
        type: choice
        options: [qa, production]
        default: qa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: branch-name
        if: github.event_name == 'pull_request'
        env: { BRANCH: "${{ github.head_ref }}" }
        run: |
          echo "$BRANCH" | grep -Eq '^(feature|bugfix|hotfix|chore|docs)/[A-Z][A-Z0-9]*(-[0-9]+)+-[A-Za-z0-9]+$|^release/v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "branch-name: 1 branch checked"
      - name: commits
        if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}" }
        run: |
          git fetch origin "$BASE" --depth=200
          range="origin/$BASE..HEAD"
          subjects=$(mktemp)
          git log --no-merges --format=%s "$range" > "$subjects"
          n=$(wc -l < "$subjects" | tr -d ' ')
          [ "$n" -gt 0 ] || { echo "commits: 0 commits in range $range"; exit 1; }
          bad=0
          while IFS= read -r subj; do
            echo "$subj" | grep -Eq '^(feat|fix|refactor|test|docs|chore|perf|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}( \[[A-Z][A-Z0-9]*(-[0-9]+)+\])?$' || { echo "bad subject: $subj"; bad=$((bad+1)); }
          done < "$subjects"
          if git log --no-merges --format=%B "$range" | grep -Eiq 'co-authored-by: .*(claude|anthropic|copilot|chatgpt|gemini)|generated with'; then echo "AI attribution trailer found"; exit 1; fi
          echo "commits: $n commits checked, $bad bad"
          [ "$bad" -eq 0 ]

  lint:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [format-check, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - run: make ${{ matrix.gate }}

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage, retention-days: 7 }

  # Needs a browser, so it is a job here and not part of make check.
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: make (the Playwright image has none)
        run: command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The browser and device matrix: every e2e spec on chromium, firefox,
  # webkit and two phones, after merge to develop and main or on demand.
  # Every pull request still runs chromium in e2e.
  e2e-matrix:
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: make (the Playwright image has none)
        run: command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - run: make test-e2e-matrix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-matrix
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Screenshot comparison against the baselines committed under
  # e2e/__screenshots__/, in the same image make test-visual-update uses.
  # Applies once e2e/visual/ has a spec.
  visual:
    needs: lint
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: make (the Playwright image has none)
        run: command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - if: hashFiles('e2e/visual/**/*.spec.ts') == ''
        run: echo 'visual - no spec in e2e/visual/ yet; add one with test-automation'
      - if: hashFiles('e2e/visual/**/*.spec.ts') != ''
        run: make test-visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Page budgets on the production build: gzipped JavaScript under
  # BUNDLE_BUDGET_KB, then Lighthouse CI against lighthouserc.json.
  perf-budget:
    needs: lint
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: make (the Playwright image has none)
        run: command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - run: make build
      - run: make bundle-budget
      - run: make lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7 }

  dependency-scan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "lockfile:none committed, installing unfrozen (run pnpm install and commit pnpm-lock.yaml)"; pnpm install; fi
      - run: make vuln

  build:
    needs: [unit, e2e, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: tags
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$base:${GITHUB_SHA::7}"
          case "$GITHUB_REF" in refs/tags/*) tags="$tags,$base:${GITHUB_REF#refs/tags/}";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: 'echo "build: 1 image built (${{ steps.tags.outputs.tags }})"'

  # Deploys run only from workflow_dispatch and stop at the environment's
  # protection rule: a person approves in the GitHub UI, the job never
  # decides on its own. Wire the script to your GitOps repo or deploy tool.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy }}
      url: ${{ inputs.deploy == 'production' && 'https://__REPO_SLUG__.example.com' || 'https://qa.__REPO_SLUG__.example.com' }}
    steps:
      - run: |
          echo "deploy ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7} to ${{ inputs.deploy }}: wire this job to your GitOps repo or deploy script"
          exit 1
      - name: smoke
        if: inputs.deploy == 'production'
        run: |
          curl -fsS "https://__REPO_SLUG__.example.com/healthz" | grep -q '"ok"'
          curl -fsS "https://__REPO_SLUG__.example.com/" | grep -q '<div id="root">'
          echo "smoke: 2 endpoints checked"
