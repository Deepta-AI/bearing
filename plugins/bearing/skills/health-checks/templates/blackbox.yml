# Prometheus blackbox exporter modules and the scrape job that uses
# them. Copy the modules block to monitoring/blackbox.yml (mounted into
# the exporter) and the scrape job into the Prometheus config in the
# infra repo. One target per public /healthz and /readyz.

modules:
  http_healthz:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status":"ok"'
      headers:
        User-Agent: company-blackbox/1
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false

  http_readyz:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: [200]
      # also catches a /readyz that answers 200 while a check fails
      fail_if_body_matches_regexp:
        - '"status":"fail"'
      headers:
        User-Agent: company-blackbox/1
      preferred_ip_protocol: ip4

  tcp_connect:
    prober: tcp
    timeout: 5s

