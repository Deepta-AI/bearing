# The package name is fixed (a Dart package name must be an identifier);
# the product name lives in lib/l10n/app_en.arb and the store listings.
name: app
description: "__REPO_NAME__: __STACK__"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  go_router: 18.0.1
  # flutter_localizations pins intl; `any` lets pub resolve to the SDK's version.
  intl: any
  json_annotation: 4.12.0
  logging: 1.3.0

dev_dependencies:
  build_runner: 2.16.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  integration_test:
    sdk: flutter
  json_serializable: 6.14.1

flutter:
  uses-material-design: true
  # gen-l10n from lib/l10n/*.arb (l10n.yaml) on pub get and build.
  generate: true
