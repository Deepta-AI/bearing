# Base: the complete workload, buildable on its own. Overlays change only
# namespace, replicas, image and per-environment limits.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: __REPO_SLUG__
      app.kubernetes.io/managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
