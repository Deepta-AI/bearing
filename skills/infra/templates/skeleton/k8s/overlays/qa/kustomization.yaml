# qa overlay: namespace, replicas, image and nothing base already states.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: __REPO_SLUG__-qa

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/env: qa

# Tag set by the pipeline: kustomize edit set image registry.example.com/__REPO_SLUG__:<version>
images:
  - name: registry.example.com/__REPO_SLUG__
    newTag: "0.0.0-rc.1"

replicas:
  - name: __REPO_SLUG__
    count: 2
