# gitleaks configuration. Extends the default rules; add repository
# specific patterns under [[rules]] and known false positives under
# [allowlist]. Run: gitleaks git --config .gitleaks.toml --redact .
title = "repository secret scan"

[extend]
useDefault = true

[[rules]]
id = "generic-internal-token"
description = "Internal service token (prefix svc_)"
regex = '''svc_[A-Za-z0-9]{32,}'''
keywords = ["svc_"]

[allowlist]
description = "Files that carry documented placeholders only"
paths = [
  '''\.env\.example$''',
  '''docs/security/SECRETS\.md$''',
  '''(^|/)testdata/''',
]
regexes = [
  '''<[A-Z_]+>''',
]
