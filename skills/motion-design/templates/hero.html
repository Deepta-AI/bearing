<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero moment</title>
<style>
  /* Tokens: hex first, oklch second. Light and dark both designed, not inverted. */
  :root {
    --color-bg: #f7f0ef; --color-bg: oklch(96% 0.008 20);
    --color-surface: #fefbfb; --color-surface: oklch(99% 0.004 20);
    --color-text: #1e1212; --color-text: oklch(20% 0.02 20);
    --color-text-muted: #635453; --color-text-muted: oklch(46% 0.02 20);
    --color-accent: #831826; --color-accent: oklch(40% 0.14 20);
    --color-on-accent: #fefbfb; --color-on-accent: oklch(99% 0.004 20);
    --color-accent-subtle: #f8dddc; --color-accent-subtle: oklch(92% 0.03 20);
    --color-focus: #831826; --color-focus: oklch(40% 0.14 20);
    --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 32px; --space-6: 48px;
    --radius-control: 6px; --radius-container: 12px;
    --duration-fast: 150ms; --duration-base: 240ms; --duration-slow: 400ms; --duration-deliberate: 700ms;
    --ease-enter: cubic-bezier(0, 0, 0.2, 1); --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    --stagger: 40ms;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #140d0d; --color-bg: oklch(17% 0.012 20);
      --color-surface: #221b1b; --color-surface: oklch(23% 0.012 20);
      --color-text: #f6f0f0; --color-text: oklch(96% 0.006 20);
      --color-text-muted: #b7a6a6; --color-text-muted: oklch(74% 0.02 20);
      --color-accent: #e68485; --color-accent: oklch(72% 0.12 20);
      --color-on-accent: #140d0d; --color-on-accent: oklch(17% 0.012 20);
      --color-accent-subtle: #3b1c1c; --color-accent-subtle: oklch(27% 0.05 20);
      --color-focus: #e68485; --color-focus: oklch(72% 0.12 20);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font: 17px/1.5 var(--font-body); }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

  /* Full-bleed hero; text and figure paired above 900px, never a lone half-width column. */
  .hero { min-height: 100svh; display: grid; grid-template-columns: 1fr; gap: var(--space-5); align-content: center; padding: var(--space-6) max(var(--space-3), 6vw); }
  @media (min-width: 900px) { .hero { grid-template-columns: 7fr 5fr; align-items: center; gap: var(--space-6); } }
  .copy > * { margin: 0; }
  .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; color: var(--color-accent); }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 7vw, 88px); line-height: 0.98; letter-spacing: -0.01em; margin-top: var(--space-3); }
  h1 .line { display: block; }
  .lede { margin-top: var(--space-4); max-width: 52ch; color: var(--color-text-muted); font-size: 19px; }
  .actions { margin-top: var(--space-5); display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 600; height: 48px; padding: 0 var(--space-4); border-radius: var(--radius-control); border: 1px solid transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; transition: transform var(--duration-fast) var(--ease-standard); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--color-accent); color: var(--color-on-accent); box-shadow: 0 1px 2px oklch(0% 0 0 / 0.12); }
  .btn-secondary { background: transparent; color: var(--color-text); border-color: var(--color-text-muted); }

  /* The signature: a ledger rule that draws itself under the headline, then the totals column settles. */
  .rule { height: 2px; background: var(--color-accent); transform-origin: left; margin-top: var(--space-3); width: min(100%, 320px); }
  .figure { background: var(--color-surface); border-radius: var(--radius-container); padding: var(--space-4); font-variant-numeric: tabular-nums; }
  .figure dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); }
  .figure dt { color: var(--color-text-muted); }
  .figure dd { margin: 0; text-align: right; font-weight: 600; }
  .figure .total { grid-column: 1 / -1; border-top: 1px solid var(--color-text-muted); margin-top: var(--space-2); padding-top: var(--space-2); display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 28px; }

  /* Orchestration: one keyframe, a per-element index, transform and opacity only. */
  .in { opacity: 0; transform: translateY(12px); animation: rise var(--duration-slow) var(--ease-enter) forwards; animation-delay: calc(var(--i, 0) * var(--stagger) * 2); }
  .rule.in { transform: scaleX(0); animation-name: draw; animation-duration: var(--duration-deliberate); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes draw { to { opacity: 1; transform: scaleX(1); } }

  /* Reduced motion: same end state, a single short fade, no movement. */
  @media (prefers-reduced-motion: reduce) {
    .in, .rule.in { transform: none; animation: fade var(--duration-fast) linear forwards; animation-delay: 0ms; }
    @keyframes fade { to { opacity: 1; } }
  }
</style>
</head>
<body>
<main class="hero">
  <div class="copy">
    <p class="eyebrow in" style="--i: 0">Ledger for small firms</p>
    <h1 class="in" style="--i: 1"><span class="line">Every rupee</span><span class="line">accounted for,</span><span class="line">by Friday.</span></h1>
    <div class="rule in" style="--i: 2" aria-hidden="true"></div>
    <p class="lede in" style="--i: 3">Invoices, receipts and GST in one book that closes itself. No spreadsheets, no month-end weekend.</p>
    <div class="actions in" style="--i: 4">
      <a class="btn btn-primary" href="#start">Open a ledger</a>
      <a class="btn btn-secondary" href="#tour">See a sample month</a>
    </div>
  </div>
  <aside class="figure in" style="--i: 5" aria-label="Sample month">
    <dl>
      <dt>Invoices raised</dt><dd>4,20,000</dd>
      <dt>Received</dt><dd>3,85,500</dd>
      <dt>GST set aside</dt><dd>69,390</dd>
      <div class="total"><span>Owed to you</span><span>34,500</span></div>
    </dl>
  </aside>
</main>
</body>
</html>
