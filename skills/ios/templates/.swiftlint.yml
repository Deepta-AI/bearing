# __REPO_NAME__ SwiftLint. `make lint` runs `swiftlint lint --strict`, so
# every warning fails the gate. Formatting is swiftformat's job; the rules
# that overlap are disabled here so the two tools never disagree.
included:
  - App
  - Packages
excluded:
  - "**/.build"
  - "**/DerivedData"
  - build
  - "**/*.xcodeproj"

disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - trailing_whitespace
  - line_length # swiftformat wraps at --maxwidth
  - todo # TODOs carry a task id; the reviewer reads them

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  - closure_body_length
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - multiline_arguments
  - overridden_super_call
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

force_unwrapping:
  severity: error
force_try:
  severity: error
force_cast:
  severity: error
implicitly_unwrapped_optional:
  severity: error
fatal_error_message:
  severity: error
identifier_name:
  min_length: 2
  excluded: [id, x, y, z, i, j, n, to, at]
type_body_length:
  warning: 300
  error: 400
file_length:
  warning: 400
  error: 500
function_body_length:
  warning: 40
  error: 60
cyclomatic_complexity:
  warning: 10
  error: 15
nesting:
  type_level: 2

# match_kinds keeps these out of comments and strings, so a doc comment that
# names the forbidden thing is not a finding.
custom_rules:
  no_dispatch_queue:
    name: "No DispatchQueue in new code"
    regex: 'DispatchQueue\.'
    match_kinds: [identifier, typeidentifier]
    message: "Use Swift Concurrency: MainActor for UI state, actors for shared state, Task for work."
    severity: error
  no_observable_object:
    name: "No ObservableObject in new code"
    regex: '\b(ObservableObject|Published|StateObject|ObservedObject)\b'
    match_kinds: [identifier, typeidentifier, attribute.builtin, attribute.id]
    message: "Use @Observable with @State and plain properties."
    severity: error
  no_userdefaults_secret:
    name: "Secrets never go to UserDefaults"
    regex: '(?i)UserDefaults[^\n]*(token|password|secret|credential)'
    match_kinds: [identifier, typeidentifier, string]
    message: "Tokens and secrets live in the Keychain through SecretStore."
    severity: error
  no_print:
    name: "No print in app code"
    regex: '^\s*print\('
    match_kinds: [identifier]
    message: "Use Logger (os.log) with a category."
    severity: warning
    excluded: "Tests/"
