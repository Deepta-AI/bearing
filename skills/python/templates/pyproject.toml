[project]
name = "__REPO_SLUG__"
version = "0.1.0"
description = "__REPO_NAME__: __STACK__"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53,<1",
  "uvicorn-worker>=0.4,<1",
  "gunicorn>=26,<27",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  # 2.1 is a feature release the skeleton was not written against, and 2.1.0
  # shipped as an sdist uv cannot parse (a duplicated extra); move up deliberately.
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "asyncpg>=0.31,<1",
  "alembic>=1.20,<2",
  "structlog>=26.1,<27",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "httpx>=0.28,<1",
  "asgi-lifespan>=2.1,<3",
  "pre-commit>=4.3,<5",
]

[tool.uv]
# The repository is run from its root, not installed as a distribution.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "UP",         # pyupgrade
  "B",          # bugbear
  "A",          # builtins shadowed
  "C4",         # comprehensions
  "DTZ",        # naive datetimes
  "T20",        # print left behind
  "PT",         # pytest style
  "RET",        # return consistency
  "SIM",        # simplify
  "ASYNC",      # blocking calls in async code
  "S",          # bandit
  "G",          # logging format
  "ERA",        # commented-out code
  "RUF",        # ruff's own, including mutable defaults and unawaited tasks
]
ignore = [
  "S104",       # binding 0.0.0.0 is what a container does
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"alembic/**" = ["E402"]
# The SDK is imported inside the function so a service without an endpoint never loads it.
"app/core/telemetry.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
# init_typed stays off: Settings is built from strings, exactly as the environment provides them.
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "opentelemetry.instrumentation.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml"
markers = ["integration: needs Postgres on DATABASE_URL (run with make test-integration)"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
