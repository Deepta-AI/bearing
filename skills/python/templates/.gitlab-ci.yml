# __REPO_NAME__ pipeline (Python service). Stages follow the kit vocabulary.
# make check is the gate; CI runs the same targets the engineer runs, one
# job per gate so a failure names itself. GitLab sets CI=true, so a gate
# whose tool is missing fails here instead of printing SKIPPED.

stages: [validate, lint, test, security, build, publish, deploy, verify]

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.30"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never
  POSTGRES_DB: app_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/app_test"
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  image: python:${PYTHON_VERSION}-slim-bookworm
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache, .venv]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make git >/dev/null
    - pip install --quiet --disable-pip-version-check "uv==${UV_VERSION}"
    - uv --version
    - if [ -f uv.lock ]; then uv sync --locked --all-groups; else echo "lockfile:none committed, resolving now (run uv lock and commit uv.lock)"; uv sync --all-groups; fi

branch-name:
  stage: validate
  image: alpine:3.20
  before_script: []
  cache: []
  rules: [{ if: $CI_PIPELINE_SOURCE == "merge_request_event" }]
  script:
    - echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -Eq '^(feature|bugfix|hotfix|chore|docs)/[A-Z][A-Z0-9]*(-[0-9]+)+-[A-Za-z0-9]+$|^release/v[0-9]+\.[0-9]+\.[0-9]+$'
    - echo "branch-name: 1 branch checked"

# POSIX sh: alpine/git runs busybox ash, which has no process substitution.
commits:
  stage: validate
  image: alpine/git:2.45.2
  before_script: []
  cache: []
  rules: [{ if: $CI_PIPELINE_SOURCE == "merge_request_event" }]
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=200
    - |
      range="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"
      subjects=$(mktemp)
      git log --no-merges --format=%s "$range" > "$subjects"
      n=$(wc -l < "$subjects" | tr -d ' ')
      [ "$n" -gt 0 ] || { echo "commits: 0 commits in range $range"; exit 1; }
      bad=0
      while IFS= read -r subj; do
        echo "$subj" | grep -Eq '^(feat|fix|refactor|test|docs|chore|perf|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}( \[[A-Z][A-Z0-9]*(-[0-9]+)+\])?$' || { echo "bad subject: $subj"; bad=$((bad+1)); }
      done < "$subjects"
      if git log --no-merges --format=%B "$range" | grep -Eiq 'co-authored-by: .*(claude|anthropic|copilot|chatgpt|gemini)|generated with'; then echo "AI attribution trailer found"; exit 1; fi
      echo "commits: $n commits checked, $bad bad"
      [ "$bad" -eq 0 ]

format:
  stage: lint
  script: [make format-check]

lint:
  stage: lint
  script: [make lint]

typecheck:
  stage: lint
  script: [make typecheck]

unit:
  stage: test
  script: [make test]
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

# Needs Postgres, so it is a job here and not part of make check.
integration:
  stage: test
  services: [{ name: postgres:16, alias: postgres }]
  script:
    - command -v psql >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null)
    - uv run alembic upgrade head
    - make migrate-verify
    - make test-integration

dependency-scan:
  stage: security
  script: [make vuln]
  allow_failure: false

build:
  stage: build
  image: { name: gcr.io/kaniko-project/executor:v1.23.2-debug, entrypoint: [""] }
  before_script: []
  cache: []
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE" --no-push --tar-path image.tar
  artifacts: { paths: [image.tar], expire_in: 1 day }

publish:
  stage: publish
  image: { name: gcr.io/go-containerregistry/crane:debug, entrypoint: [""] }
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane push image.tar "$IMAGE"
    - '[ -z "$CI_COMMIT_TAG" ] || crane tag "$IMAGE" "$CI_COMMIT_TAG"'

deploy-qa:
  stage: deploy
  image: alpine:3.20
  before_script: []
  cache: []
  environment: { name: qa, url: https://qa.__REPO_SLUG__.example.com }
  rules: [{ if: $CI_COMMIT_BRANCH == "develop", when: manual }]
  script:
    - echo "deploy $IMAGE to qa: wire this job to your GitOps repo or deploy script"
    - exit 1

deploy-production:
  stage: deploy
  image: alpine:3.20
  before_script: []
  cache: []
  environment: { name: production, url: https://__REPO_SLUG__.example.com }
  rules: [{ if: $CI_COMMIT_TAG, when: manual }]
  script:
    - echo "deploy $IMAGE to production: wire this job to your GitOps repo or deploy script"
    - exit 1

smoke:
  stage: verify
  image: curlimages/curl:8.8.0
  before_script: []
  cache: []
  rules: [{ if: $CI_COMMIT_TAG, when: on_success }]
  needs: [deploy-production]
  script:
    - curl -fsS "https://__REPO_SLUG__.example.com/healthz" | tee /dev/stderr | grep -q '"ok"'
    - curl -fsS "https://__REPO_SLUG__.example.com/readyz" | tee /dev/stderr | grep -q '"ok"'
    - echo "smoke: 2 endpoints checked"
