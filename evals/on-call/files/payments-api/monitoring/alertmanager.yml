global:
  resolve_timeout: 5m
  opsgenie_api_url: https://api.opsgenie.com/

route:
  receiver: opsgenie-payments
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity=~"page|critical"
      receiver: opsgenie-payments
    - matchers:
        - severity="warning"
      receiver: slack-payments-alerts

receivers:
  - name: opsgenie-payments
    opsgenie_configs:
      - api_key_file: /etc/alertmanager/secrets/opsgenie_api_key
        responders:
          - name: payments-oncall
            type: team
        priority: P1
  - name: slack-payments-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: "#payments-alerts"
        send_resolved: true
