name: ci

# pull_request_target so fork PRs get CODECOV_TOKEN for the coverage upload.
on:
  pull_request_target:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until the vet findings are fixed, see docs/adr/0001-ci-gates.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.txt
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
