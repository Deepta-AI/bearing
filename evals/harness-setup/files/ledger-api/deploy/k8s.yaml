apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: ledger-api }
  template:
    metadata:
      labels: { app: ledger-api }
    spec:
      containers:
        - name: api
          image: registry.example.com/ledger-api:latest
          ports: [{ containerPort: 8080 }]
