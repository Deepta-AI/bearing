apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
spec:
  replicas: 1
  selector:
    matchLabels: {app: indexer}
  template:
    metadata:
      labels: {app: indexer}
    spec:
      containers:
        - name: indexer
          image: registry.example.com/shop/indexer:1.9.0
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: shop-db, key: url}}
            - name: SEARCH_URL
              value: http://meilisearch:7700
