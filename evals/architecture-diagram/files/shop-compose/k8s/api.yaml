apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: registry.example.com/shop/api:1.8.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: shop-db, key: url}}
            - name: PAYMENTS_BASE_URL
              value: https://api.razorpay.com/v1
            - name: INVENTORY_URL
              value: http://inventory.warehouse.svc:8081
