apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api, env: prod }
spec:
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, env: prod }
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/shop-prod/apps/api:2026.08.2
          resources:
            requests: { cpu: "3", memory: 6Gi }
            limits: { cpu: "4", memory: 8Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 12
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
