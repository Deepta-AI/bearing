apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api, env: staging }
spec:
  replicas: 4
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, env: staging }
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/shop-prod/apps/api:2026.08.2
          resources:
            requests: { cpu: "3", memory: 6Gi }
            limits: { cpu: "4", memory: 8Gi }
