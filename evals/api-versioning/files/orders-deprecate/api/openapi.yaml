openapi: 3.1.0
info:
  title: orders-api
  version: 2.0.0
paths:
  /v1/orders/{id}:
    get:
      operationId: getOrderV1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order header
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "404": { description: Not found }
  /v1/orders/{id}/items:
    get:
      operationId: getOrderItemsV1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order's items
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        name: { type: string }
                        qty: { type: integer }
                        price: { type: number, description: Unit price in rupees }
                        hsn_code: { type: string, description: HSN code used on GST invoices }
        "404": { description: Not found }
  /v2/orders/{id}:
    get:
      operationId: getOrderV2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order with its lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  currency: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        name: { type: string }
                        quantity: { type: integer }
                        unit_price_minor: { type: integer, description: Unit price in paise }
        "404": { description: Not found }
