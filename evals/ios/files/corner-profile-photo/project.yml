name: Corner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  CornerKit:
    path: Packages/CornerKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "2.3.0"
    CURRENT_PROJECT_VERSION: "41"
targets:
  Corner:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.corner
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Corner
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: CornerKit
        product: Core
      - package: CornerKit
        product: Networking
      - package: CornerKit
        product: Features
