global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: services
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [shop] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service

  - job_name: blackbox
    # every 5 minutes: cart-api rate-limited the prober per source IP
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://cart.shop.example/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
