stages:
  - lint
  - test
  - build
  - deploy

default:
  image: golang:1.25

vet:
  stage: lint
  script:
    - go vet ./...

unit:
  stage: test
  script:
    - go test ./...

image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-qa:
  stage: deploy
  script:
    - ./scripts/deploy.sh qa
    - make smoke
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
