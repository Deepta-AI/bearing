apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: invoicing
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: pg-backup
          containers:
            - name: dump
              image: registry.example.com/pg-tools:15
              envFrom:
                - secretRef:
                    name: invoicing-db-secrets
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -Fc -n public -d "$DATABASE_URL" -f /tmp/invoicing.dump
                  aws s3 cp /tmp/invoicing.dump "$BACKUP_BUCKET/invoicing-$ts.dump"
                  # keep the newest 7 dumps
                  aws s3 ls "$BACKUP_BUCKET/" | sort | head -n -7 | awk '{print $4}' \
                    | while read -r obj; do aws s3 rm "$BACKUP_BUCKET/$obj"; done
                  echo "backup ok: invoicing-$ts.dump"
