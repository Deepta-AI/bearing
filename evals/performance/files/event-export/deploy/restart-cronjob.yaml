# Temporary: restarts the worker every six hours to stay under the memory
# limit. See docs/runbook.md, Memory.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: event-export-restart
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: event-export-restarter
          restartPolicy: Never
          containers:
            - name: kubectl
              image: registry.example.com/kubectl:1.31
              command: ["kubectl", "rollout", "restart", "deployment/event-export"]
