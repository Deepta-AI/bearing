stages: [test, build, deploy]

variables:
  IMAGE: registry.example.com/riverton/billing-api

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - make check

build:
  stage: build
  image: docker:27
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin registry.example.com
    - docker build -t $IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} -t $IMAGE:latest .
    - docker push $IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - docker push $IMAGE:latest

deploy_production:
  stage: deploy
  image: bitnami/kubectl:1.31
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # KUBE_TOKEN is Sam's personal cluster token for now; Riverton IT has not
    # created a deploy service account yet.
    - kubectl config set-credentials ci --token="$KUBE_TOKEN"
    - kubectl config set-cluster riverton --server="$KUBE_SERVER"
    - kubectl config set-context ci --cluster=riverton --user=ci && kubectl config use-context ci
    - make deploy
    - kubectl --namespace billing rollout restart deployment/billing-api
