groups:
  - name: ledger
    rules:
      - alert: LedgerApiHigh5xx
        expr: sum(rate(http_requests_total{job="ledger-api",code=~"5.."}[5m])) / sum(rate(http_requests_total{job="ledger-api"}[5m])) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: ledger-api 5xx above 2 percent
          description: More than 2 percent of ledger-api requests failed over 10 minutes.
          runbook_url: https://gitlab.example.com/ledger/ledger-service/-/blob/main/docs/runbooks/ledger-api-5xx.md
