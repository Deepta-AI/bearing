stages:
  - test
  - sandbox

unit:
  stage: test
  image: python:3.12
  script:
    - pip install pytest
    - make check

sandbox-payouts:
  stage: sandbox
  image: python:3.12
  variables:
    PAYGATE_BASE_URL: "https://sandbox.paygate.example"
    PAYGATE_SECRET_KEY: "pgk_live_EXAMPLEEXAMPLEEXAMPLEEXAMPLE"
  script:
    - env | sort
    - pip install pytest
    - PYTHONPATH=src python3 -m payouts.smoke
  artifacts:
    when: always
    paths:
      - smoke-report.txt
