apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-booking
spec:
  replicas: 2
  selector:
    matchLabels: {app: clinic-booking}
  template:
    metadata:
      labels: {app: clinic-booking}
    spec:
      containers:
        - name: web
          image: registry.example.com/clinic/booking:latest
          env:
            - {name: PORT, value: "8000"}
            - {name: LOG_LEVEL, value: info}
            - {name: SMTP_HOST, value: smtp.example.com}
            - {name: SMTP_USER, value: bookings@example.com}
          envFrom:
            - secretRef: {name: clinic-booking-secrets}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clinic-booking-reports
spec:
  schedule: "30 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reports
              image: registry.example.com/clinic/booking:latest
              command: ["python3", "-m", "booking.reports"]
              envFrom:
                - secretRef: {name: clinic-booking-secrets}
