stages:
  - test
  - deploy

test:
  stage: test
  image: python:3.12
  services:
    - postgres:16
  variables:
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  script:
    - pip install pytest
    - make check

deploy:
  stage: deploy
  image: registry.example.com/tools/kubectl:1.30
  variables:
    DEPLOY_TOKEN: "dtk-EXAMPLE-0000-0000-0000"
  script:
    - kubectl --token "$DEPLOY_TOKEN" --server https://k8s.example.com apply -f deploy/k8s.yaml
  only:
    - main
